[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       json
    Reserve_Data On

[OUTPUT]
    Name         es
    Match        *
    Host         elasticsearch
    Port         9200
    Index        carscope_logs
    Logstash_Format On
    Retry_Limit  False
