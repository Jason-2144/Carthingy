global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'carscope-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'carscope-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'carscope-redis'
    static_configs:
      - targets: ['redis-exporter:9121']
      
  - job_name: 'carscope-worker'
    static_configs:
      - targets: ['celery-exporter:9808']
