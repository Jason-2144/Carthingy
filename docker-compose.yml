version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/carscope
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=development-secret-key-do-not-use-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app/backend

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=carscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  scraper_worker:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/carscope
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A scraper.queue.celery_app worker --loglevel=info -Q scrape_jobs,process_listings -c 5

  scraper_beat:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/carscope
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_started
    command: celery -A scraper.queue.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
